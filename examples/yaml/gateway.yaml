# PraisonAI Multi-Bot Gateway Configuration
# Start with: praisonai gateway start --config gateway.yaml

gateway:
  host: "127.0.0.1"
  port: 8765

agents:
  personal:
    name: "Personal Assistant"
    instructions: "You are a friendly personal assistant. Help users with everyday tasks."
    llm: "gpt-4o-mini"

  support:
    name: "Support Agent"
    instructions: "You are a customer support agent. Be professional and helpful."
    llm: "gpt-4o-mini"

channels:
  telegram:
    <REDACTED_SECRET>
    # allow_shell: true
    # auto_approve_shell: false
    # approval_channel: "123456789"   # Telegram chat ID for shell approvals
    routing:
      dm: "personal"
      group: "support"
      default: "personal"

  discord:
    <REDACTED_SECRET>
    # allow_shell: true
    # auto_approve_shell: false
    # approval_channel: "9876543210"  # Discord channel ID (or use home_channel)
    routing:
      dm: "personal"
      channel: "support"
      default: "support"

  slack:
    <REDACTED_SECRET>
    app_<REDACTED_SECRET>
    allow_shell: true
    auto_approve_shell: true
    routing:
      dm: "personal"
      channel: "support"
      default: "support"

  whatsapp:
    <REDACTED_SECRET>
    phone_number_id: "${WHATSAPP_PHONE_NUMBER_ID}"
    verify_<REDACTED_SECRET>
    webhook_port: 8080
    routing:
      dm: "personal"
      default: "personal"

  # WhatsApp Web mode (experimental, no tokens needed):
  # whatsapp:
  #   mode: web
  #   creds_dir: "~/.praisonai/whatsapp"
  #   routing:
  #     dm: "personal"
  #     default: "personal"
